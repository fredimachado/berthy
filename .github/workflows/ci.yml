name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.classify.outputs.go }}
      e2e: ${{ steps.classify.outputs.e2e }}
      harness: ${{ steps.classify.outputs.harness }}
      actions: ${{ steps.classify.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/changed-files"
            flags=$(bash test/e2e/changes.sh < "$RUNNER_TEMP/changed-files")
          else
            flags='go=true e2e=true harness=true actions=true'
          fi
          for flag in $flags; do echo "$flag" >> "$GITHUB_OUTPUT"; done

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Format, vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Linux-only and portable files differ by build tag, so vet every target the CLI ships for.
      - name: Vet
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "go vet ($target)"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
          done

      - name: Check blocking lint rules
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "golangci-lint ($target)"
            GOOS=${target%/*} GOARCH=${target#*/} "$(go env GOPATH)/bin/golangci-lint" run --config .golangci.yml ./...
          done

      - name: Report advisory lint findings
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "golangci-lint report ($target)"
            GOOS=${target%/*} GOARCH=${target#*/} "$(go env GOPATH)/bin/golangci-lint" run --config .golangci-report.yml --issues-exit-code=0 ./...
          done

  tests:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    name: ${{ format('Tests ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The agent's concurrency (inspect pool, metrics collector, shared statfs calls) runs on Linux,
      # so the race detector runs there; the other platforms cover the CLI and portable code.
      - name: Run tests with the race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Run tests
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Static release builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "go build ($target)"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/berthy
          done

      - name: Confirm the Linux agent binary is static
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o "$RUNNER_TEMP/berthy" ./cmd/berthy
          file "$RUNNER_TEMP/berthy" | tee /dev/stderr | grep -q 'statically linked'

  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    name: Verification harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: shellcheck test/phase1/*.sh test/e2e/shard.sh test/e2e/tests/shard.sh test/e2e/ci-prepare.sh test/e2e/tests/ci-prepare.sh test/e2e/changes.sh test/e2e/tests/changes.sh

      - name: Check change classification
        run: bash test/e2e/tests/changes.sh

      - name: Check fakeserver build selection
        run: bash test/e2e/tests/ci-prepare.sh

      - name: Check e2e shard coverage
        run: bash test/e2e/tests/shard.sh

      - name: Ingress report classifier
        run: python3 test/phase1/ingress-report-test.py

      - name: Ingress script ignores an inherited Docker context
        run: bash test/phase1/ingress-context-test.sh

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    env:
      PROJECT: shop
      ENVN: stage
    name: ${{ format('End-to-end ({0}/{1})', matrix.shard, strategy.job-total) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare the fixture
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          {
            echo "GO=$(command -v go)"
            echo "DOCKER_BIN=$(command -v docker)"
            echo "SOCK=/var/run/docker.sock"
            echo "COMPOSE_BIN=$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')"
          } >> "$GITHUB_ENV"
          mapfile -t scenarios < <(bash test/e2e/shard.sh "$SHARD" "$SHARDS")
          test "${#scenarios[@]}" -gt 0
          DOCKER_BIN=$(command -v docker) SOCK=/var/run/docker.sock bash test/e2e/ci-prepare.sh "${scenarios[@]}"

      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mapfile -t scenarios < <(bash test/e2e/shard.sh "$SHARD" "$SHARDS")
          test "${#scenarios[@]}" -gt 0
          bash test/e2e/run.sh "${scenarios[@]}"

      - name: Keep the scenario logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: ~/berthy-e2e/harness/runs

  lint-actions:
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  result:
    name: CI result
    needs: [changes, lint, tests, build, harness, e2e, lint-actions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
