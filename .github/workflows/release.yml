name: Release

# Publishing is driven by a version tag, so a release is never built from a branch. setup downloads these assets by tag.
# workflow_dispatch is a dry run: it checks and builds the dispatched commit and publishes nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp in a dry run (nothing is published)
        default: v0.0.0-dryrun.1
        required: true

# No permissions for the workflow as a whole: each job asks for what it needs.
permissions: {}

jobs:
  # A release publishes only a commit whose CI run succeeded. It runs alongside the builds, and publish waits for both.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Read CI's runs for this commit.
      actions: read
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      # Same pattern as versionTag in internal/setup/binary.go: setup refuses any other version, so no other tag is published.
      - name: Check the version
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v[0-9][0-9A-Za-z.+_-]*$'; then
            echo "tag $VERSION is not a release version (v<digit>...)" >&2
            exit 1
          fi

      # ci.yml cancels an older run of main when a newer push starts (concurrency), so a commit can end with no successful
      # run. The gate fails then, on purpose: tag a commit whose CI passed.
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Poll the ci.yml runs for exactly this commit. Pass on a successful run. Fail at once when none succeeded and none is
          # still queued or running. Wait while one is, and give up after 15 minutes. Any event counts (a push to main, a
          # workflow_dispatch): the commit is what matters. CI_WAIT_SECONDS shortens the wait; the workflow never sets it.
          deadline=$(( $(date +%s) + ${CI_WAIT_SECONDS:-900} ))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" \
                   --jq '[.workflow_runs[] | {status, conclusion, id: .id, url: .html_url}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed for $SHA: $(jq -r '[.[] | select(.conclusion=="success")][0].url' <<<"$runs")"; exit 0
            fi
            if ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null && jq -e 'length > 0' <<<"$runs" >/dev/null; then
              echo "CI did not pass for $SHA:" >&2; jq -r '.[] | "  \(.conclusion) \(.url)"' <<<"$runs" >&2
              echo "Fix main and tag a commit whose CI passed." >&2; exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "no successful CI run for $SHA within 15 minutes (push the commit to main, or wait for CI and re-run this job)" >&2; exit 1
            fi
            sleep 30
          done

  # The builds start with the gate, not after it, so they overlap a gate that is still waiting for CI. Each target has its own
  # runner. The Linux checks run where the Linux binary is built.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      # Check out the code and upload the binary; nothing here writes to the repository.
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      NAME: berthy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No build cache in a release workflow, so a poisoned cache cannot reach the published binaries (zizmor cache-poisoning).
          cache: false

      # Same check as the gate: the build stamps the version, so it validates it too.
      - name: Check the version
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v[0-9][0-9A-Za-z.+_-]*$'; then
            echo "tag $VERSION is not a release version (v<digit>...)" >&2
            exit 1
          fi

      # Static binary, stamped with the version: berthy version reports it and setup compares it.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X berthy/internal/version.Version=$VERSION" -o "dist/$NAME" ./cmd/berthy

      # The server installs the linux binaries, so check that they are static.
      - name: Check the Linux binary is static
        if: matrix.goos == 'linux'
        run: file "dist/$NAME" | tee /dev/stderr | grep -q 'statically linked'

      # The amd64 binary runs on this runner; the arm64 one cannot run here without an emulator. version --json reports
      # release for every v-version, a dry run's included, so this asserts the same thing for a dry run as for a tag.
      - name: Check the amd64 binary reports this version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/berthy-linux-amd64 version --json | jq -e --arg v "$VERSION" '.version == $v and .release == true'

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: berthy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # The only job that writes to the repository. It runs for a tag push only, never for a dry run.
  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release is the only write this workflow makes.
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      # gh release create --verify-tag checks the tag in the repository, so this job needs the checkout.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: berthy-*
          merge-multiple: true

      # Exactly the five release binaries are published, and nothing else.
      - name: Check the binaries
        run: |
          want=$(printf '%s\n' berthy-darwin-amd64 berthy-darwin-arm64 berthy-linux-amd64 berthy-linux-arm64 berthy-windows-amd64.exe | sort)
          have=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [ "$have" != "$want" ]; then
            echo "dist does not hold exactly the five release binaries:" >&2
            echo "$have" >&2
            exit 1
          fi

      # Names only, without the dist/ prefix: the server finds its line by the file name.
      - name: Write checksums
        working-directory: dist
        run: sha256sum berthy-* > checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a "-" (v1.2.0-rc.1) is a prerelease, so it never becomes "latest".
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          # gh release create fails when the release exists, so published assets are never replaced.
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --generate-notes "${prerelease[@]}"
